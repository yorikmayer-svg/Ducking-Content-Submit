<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Duck Republik — Content Uploader</title>
    <!-- Google Fonts: Montserrat (matching Duck Republik typography) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Telegram Web App SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'duck-yellow': '#FFE600',
                        'duck-black': '#000000',
                        'duck-pink': '#D9326F',
                        'duck-red': '#D53446',
                    },
                    fontFamily: {
                        sans: ['Montserrat', 'sans-serif'],
                    },
                    boxShadow: {
                        'brutal': '4px 4px 0px #000000',
                        'brutal-sm': '2px 2px 0px #000000',
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Montserrat', sans-serif;
            background-color: #FFE600;
        }

        /* Custom Button Gradient matching Duck Republik */
        .btn-duck-gradient {
            background: linear-gradient(273.05deg, #D9326F 0%, #D53446 100%);
            box-shadow: 4px 4px 0px #000000;
            transition: all 0.12s ease-in-out;
        }
        .btn-duck-gradient:hover:not(:disabled) {
            transform: translate(2px, 2px);
            box-shadow: 2px 2px 0px #000000;
        }
        .btn-duck-gradient:active:not(:disabled) {
            transform: translate(4px, 4px);
            box-shadow: 0px 0px 0px #000000;
        }

        /* Brutal Input focus effect */
        .duck-input {
            border: 2px solid #000000;
            transition: all 0.12s ease-in-out;
        }
        .duck-input:focus {
            outline: none;
            box-shadow: 3px 3px 0px #000000;
            border-color: #000000;
        }
    </style>
</head>

                </div>

                <!-- Telegram User Tag -->
                <div id="userBadge" class="hidden bg-black text-duck-yellow font-extrabold text-[11px] px-2.5 py-0.5 rounded-full uppercase tracking-wider">
                    Citizen
                </div>
            </div>

            <h1 class="text-2xl font-black uppercase tracking-tight text-black">
                Upload Content
            </h1>
            <p class="text-xs font-semibold text-black/80 mt-0.5">
                Add title, link, or media files for the system.
            </p>
        </div>

        <!-- Form -->
        <form id="uploadForm" class="space-y-4">
            <!-- Content Title -->
            <div>
                <label class="block text-xs font-black uppercase tracking-wider text-black mb-1">
                    Content Title <span class="text-duck-pink">*</span>
                </label>
                <input type="text" id="title" required placeholder="e.g. poker night recap" 
                    class="duck-input w-full bg-white rounded-xl px-4 py-2.5 text-black text-sm font-medium placeholder-gray-400">
            </div>

            <!-- Reference Link -->
            <div>
                <div class="flex justify-between items-center mb-1">
                    <label class="block text-xs font-black uppercase tracking-wider text-black">
                        Reference Link
                    </label>
                    <span class="text-[10px] font-bold text-black/60 uppercase">TikTok / IG / YouTube</span>
                </div>
                <input type="url" id="link" placeholder="https://instagram.com/p/..." 
                    class="duck-input w-full bg-white rounded-xl px-4 py-2.5 text-black text-sm font-medium placeholder-gray-400">
            </div>

            <!-- Media Files -->
            <div>
                <label class="block text-xs font-black uppercase tracking-wider text-black mb-1">
                    Media Files (Photos / Videos)
                </label>
                
                <div id="dropZone" 
                    class="duck-input border-2 border-dashed border-black rounded-xl p-4 text-center bg-white/90 hover:bg-white cursor-pointer transition-colors relative group">
                    <input type="file" id="files" multiple accept="image/*,video/*" class="hidden">
                    
                    <div class="flex flex-col items-center justify-center space-y-1.5 pointer-events-none">
                        <div class="w-8 h-8 rounded-full bg-duck-yellow border-2 border-black flex items-center justify-center shadow-brutal-sm">
                            <svg class="w-4 h-4 text-black" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 4v16m8-8H4"></path>
                            </svg>
                        </div>
                        <div>
                            <span class="text-xs font-bold text-black uppercase tracking-wider block">Tap to choose files</span>
                            <span class="text-[10px] font-semibold text-gray-600">Images & video clips</span>
                        </div>
                    </div>
                </div>

                <!-- Selected Files List -->
                <div id="fileList" class="mt-2.5 space-y-1.5 hidden"></div>

                <!-- Large file warning -->
                <div id="sizeWarning" class="hidden mt-2 p-2 bg-yellow-200 border-2 border-black rounded-lg text-xs font-semibold text-black flex items-center gap-1.5">
                    <span>⚠️</span>
                    <span>Large files selected. Uploading high-res clips may take a moment.</span>
                </div>
            </div>

            <!-- Submit Button -->
            <button type="submit" id="submitBtn" 
                class="btn-duck-gradient w-full text-white font-black text-sm uppercase tracking-wider py-3.5 rounded-xl border-2 border-black flex items-center justify-center space-x-2">
                <span id="btnText">Upload to System</span>
                <svg id="btnIcon" class="w-4 h-4 ml-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M14 5l7 7m0 0l-7 7m7-7H3"></path>
                </svg>
            </button>
        </form>

        <!-- Status Message -->
        <div id="status" class="text-center font-bold text-xs uppercase tracking-wider p-3 rounded-xl border-2 border-black hidden"></div>

    </div>

    <script>
        // Telegram Web App Initialization
        const tg = window.Telegram?.WebApp;
        if (tg) {
            try {
                tg.ready();
                tg.expand();
                
                // Show citizen handle if available in Telegram initData
                const user = tg.initDataUnsafe?.user;
                if (user) {
                    const badge = document.getElementById('userBadge');
                    const name = user.username ? `@${user.username}` : (user.first_name || 'Citizen');
                    badge.textContent = name;
                    badge.classList.remove('hidden');
                }
            } catch (err) {
                console.warn('Telegram WebApp context init:', err);
            }
        }

        const WEBHOOK_URL = 'https://n8n.smca.digital/webhook/b2a11c85-29ab-43df-a58b-4a2b37146d7a';

        // File Selection Management
        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('files');
        const fileList = document.getElementById('fileList');
        const sizeWarning = document.getElementById('sizeWarning');
        
        let selectedFiles = [];

        dropZone.addEventListener('click', () => fileInput.click());

        fileInput.addEventListener('change', (e) => {
            const files = Array.from(e.target.files);
            addFiles(files);
            fileInput.value = '';
        });

        // Drag and drop handlers
        ['dragenter', 'dragover'].forEach(eventName => {
            dropZone.addEventListener(eventName, (e) => {
                e.preventDefault();
                e.stopPropagation();
                dropZone.classList.add('bg-white');
            }, false);
        });

        ['dragleave', 'drop'].forEach(eventName => {
            dropZone.addEventListener(eventName, (e) => {
                e.preventDefault();
                e.stopPropagation();
                dropZone.classList.remove('bg-white');
            }, false);
        });

        dropZone.addEventListener('drop', (e) => {
            const dt = e.dataTransfer;
            const files = Array.from(dt.files);
            addFiles(files);
        });

        function addFiles(newFiles) {
            selectedFiles = [...selectedFiles, ...newFiles];
            renderFileList();
        }

        function removeFile(index) {
            selectedFiles.splice(index, 1);
            renderFileList();
        }

        function formatBytes(bytes) {
            if (bytes === 0) return '0 B';
            const k = 1024;
            const sizes = ['B', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(1)) + ' ' + sizes[i];
        }

        function renderFileList() {
            fileList.innerHTML = '';
            
            if (selectedFiles.length === 0) {
                fileList.classList.add('hidden');
                sizeWarning.classList.add('hidden');
                return;
            }

            fileList.classList.remove('hidden');

            let totalSize = 0;

            selectedFiles.forEach((file, idx) => {
                totalSize += file.size;
                const isVideo = file.type.startsWith('video');

                const item = document.createElement('div');
                item.className = 'flex items-center justify-between p-2 bg-white border-2 border-black rounded-lg text-xs font-semibold shadow-brutal-sm';
                item.innerHTML = `
                    <div class="flex items-center space-x-2 truncate pr-2">
                        <span>${isVideo ? '🎬' : '📷'}</span>
                        <span class="truncate text-black font-bold">${file.name}</span>
                        <span class="text-gray-500 text-[10px] shrink-0 font-medium">(${formatBytes(file.size)})</span>
                    </div>
                    <button type="button" class="text-duck-pink hover:text-black font-black text-sm px-1.5 py-0.5 rounded transition-colors" title="Remove file" onclick="removeFile(${idx})">✕</button>
                `;
                fileList.appendChild(item);
            });

            if (totalSize > 25 * 1024 * 1024) {
                sizeWarning.classList.remove('hidden');
            } else {
                sizeWarning.classList.add('hidden');
            }
        }

        // Form Submit
        document.getElementById('uploadForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            const btnText = document.getElementById('btnText');
            const btnIcon = document.getElementById('btnIcon');
            const status = document.getElementById('status');
            
            btn.disabled = true;
            btnText.textContent = 'Uploading...';
            btnIcon.classList.add('animate-spin');
            status.classList.add('hidden');

            try {
                const title = document.getElementById('title').value;
                const link = document.getElementById('link').value;
                
                const filesArray = [];

                for (let i = 0; i < selectedFiles.length; i++) {
                    const file = selectedFiles[i];
                    btnText.textContent = `Processing ${i + 1}/${selectedFiles.length}...`;
                    const base64Data = await toBase64(file);
                    filesArray.push({
                        name: file.name,
                        type: file.type,
                        size: file.size,
                        data: base64Data
                    });
                }

                btnText.textContent = 'Uploading to System...';

                const user = tg?.initDataUnsafe?.user;

                const payload = {
                    title: title,
                    link: link,
                    files: filesArray,
                    user: user ? {
                        id: user.id,
                        username: user.username,
                        first_name: user.first_name,
                        last_name: user.last_name
                    } : null,
                    initData: tg?.initData || null
                };

                const response = await fetch(WEBHOOK_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(payload)
                });

                if (!response.ok) throw new Error(`Server returned code ${response.status}`);

                status.textContent = '✓ Successfully uploaded!';
                status.className = 'text-center font-bold text-xs uppercase tracking-wider p-2.5 rounded-xl border-2 border-black bg-white text-black shadow-brutal-sm';
                status.classList.remove('hidden');

                document.getElementById('uploadForm').reset();
                selectedFiles = [];
                renderFileList();

                if (tg?.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');

            } catch (error) {
                console.error(error);
                status.textContent = `Upload failed: ${error.message}`;
                status.className = 'text-center font-bold text-xs uppercase tracking-wider p-2.5 rounded-xl border-2 border-black bg-red-100 text-duck-red shadow-brutal-sm';
                status.classList.remove('hidden');
                
                if (tg?.HapticFeedback) tg.HapticFeedback.notificationOccurred('error');
            } finally {
                btn.disabled = false;
                btnText.textContent = 'Upload to System';
                btnIcon.classList.remove('animate-spin');
            }
        });

        const toBase64 = file => new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = () => resolve(reader.result);
            reader.onerror = error => reject(error);
        });
    </script>
</body>
</html>
